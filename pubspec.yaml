name: mepaga_ai
description: Trasnfira seus ingressos com segurança

publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ">=3.3.0 <4.0.0"

dependencies:
    adaptive_dialog: ^2.0.0
    another_flushbar: ^1.12.30
    auto_route: ^11.1.0
    auto_route_generator: ^10.5.0
    auto_size_text: ^3.0.0
    badges: ^3.1.2
    bottom_sheet: ^4.0.4
    build_runner: ^2.3.3
    cached_network_image: ^3.3.1
    clipboard: ^3.0.14
    cpf_cnpj_validator: ^2.0.0
    cupertino_icons: ^1.0.2
    dio: ^5.1.1
    domain:
        path: domain
    dropdown_button2: ^2.3.9
    email_validator: ^2.1.17
    firebase_core: ^4.4.0
    flutter:
        sdk: flutter
    flutter_bloc: ^9.1.1
    flutter_countdown_timer: ^4.1.0
    flutter_exit_app: ^2.0.0
    flutter_launcher_icons: ^0.14.4
    flutter_native_splash: ^2.3.10
    flutter_otp_text_field: ^1.1.1
    flutter_screenutil: ^5.9.0
    flutter_secure_storage: ^10.0.0
    flutter_svg: ^2.0.4
    flutter_web_plugins:
        sdk: flutter
    focus_detector_v2: ^3.0.0+2
    go_router: ^17.1.0
    google_fonts: ^8.0.1
    infinite_scroll_pagination: ^5.1.1
    intl: ^0.20.2
    json_serializable: ^6.6.1
    logger: ^2.6.2
    lottie: ^3.3.2
    persistent_bottom_nav_bar: ^6.2.1
    pinput: ^6.0.2
    provider: ^6.0.5
    responsive_styles: ^2.3.1
    shimmer: ^3.0.0
    simple_shadow: ^0.3.1
    smooth_page_indicator: ^2.0.1
    styled_text: ^9.0.0
    text_scroll: ^0.2.0
    app_links: ^7.0.0

dev_dependencies:
    flutter_lints: ^6.0.0
    flutter_test:
        sdk: flutter
    very_good_analysis: ^10.1.0

flutter:
    uses-material-design: true

    assets:
        - assets/
    fonts:
        - family: CustomIcons
          fonts:
              - asset: fonts/CustomIcons.ttf
    # fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    #   - family: Trajan Pro
    #     fonts:
    #       - asset: fonts/TrajanPro.ttf
    #       - asset: fonts/TrajanPro_Bold.ttf
    #         weight: 700
    #
    # For details regarding fonts from package dependencies,
    # see https://flutter.dev/custom-fonts/#from-packages

flutter_native_splash:
    color: "#3B0082"
    android: true
    ios: true
    android_12:
        # The image parameter sets the splash screen icon image.  If this parameter is not specified,
        # the app's launcher icon will be used instead.
        # Please note that the splash screen will be clipped to a circle on the center of the screen.
        # App icon with an icon background: This should be 960×960 pixels, and fit within a circle
        # 640 pixels in diameter.
        # App icon without an icon background: This should be 1152×1152 pixels, and fit within a circle
        # 768 pixels in diameter.
        # image: assets/splash_screen.png

        color: "#3B0082"
        icon_background_color: "#3B0082"

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/mpg_icon.png"
