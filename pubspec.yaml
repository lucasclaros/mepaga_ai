name: mepaga_ai
description: Trasnfira seus ingressos com segurança

publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ">=2.19.0 <3.0.0"

dependencies:
    adaptive_dialog: ^2.0.0
    another_flushbar: ^1.12.30
    auto_route: ^7.8.4
    auto_route_generator: ^7.3.2
    auto_size_text: ^3.0.0
    bottom_sheet: ^3.1.2
    build_runner: ^2.3.3
    clipboard: ^0.1.3
    cpf_cnpj_validator: ^2.0.0
    cupertino_icons: ^1.0.2
    dio: ^5.1.1
    domain:
        path: domain
    dropdown_button2: ^2.3.9
    email_validator: ^2.1.17
    firebase_core: ^2.25.4
    flutter:
        sdk: flutter
    flutter_bloc: ^8.1.2
    flutter_exit_app: ^1.1.2
    flutter_launcher_icons: ^0.13.1
    flutter_native_splash: ^2.3.10
    flutter_otp_text_field: ^1.1.1
    flutter_screenutil: ^5.9.0
    flutter_secure_storage: ^8.0.0
    flutter_svg: ^2.0.4
    flutter_web_plugins:
        sdk: flutter
    focus_detector_v2: ^3.0.0+2
    go_router: ^13.2.0
    google_fonts: ^4.0.3
    infinite_scroll_pagination: ^4.0.0
    json_serializable: ^6.6.1
    logger: ^1.3.0
    lottie: ^2.3.0
    persistent_bottom_nav_bar: ^5.0.2
    pinput: ^2.2.31
    provider: ^6.0.5
    responsive_styles: ^2.3.1
    shimmer: ^3.0.0
    simple_shadow: ^0.3.1
    smooth_page_indicator: ^1.0.1
    styled_text: ^7.0.0
    text_scroll: ^0.2.0
    uni_links: ^0.5.1

dev_dependencies:
    flutter_lints: ^2.0.0
    flutter_test:
        sdk: flutter
    very_good_analysis: ^4.0.0+1

flutter:
    uses-material-design: true

    assets:
        - assets/
    fonts:
        - family: CustomIcons
          fonts:
              - asset: fonts/CustomIcons.ttf
    # fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    #   - family: Trajan Pro
    #     fonts:
    #       - asset: fonts/TrajanPro.ttf
    #       - asset: fonts/TrajanPro_Bold.ttf
    #         weight: 700
    #
    # For details regarding fonts from package dependencies,
    # see https://flutter.dev/custom-fonts/#from-packages

flutter_native_splash:
    color: "#3B0082"
    android: true
    ios: true
    android_12:
        # The image parameter sets the splash screen icon image.  If this parameter is not specified,
        # the app's launcher icon will be used instead.
        # Please note that the splash screen will be clipped to a circle on the center of the screen.
        # App icon with an icon background: This should be 960×960 pixels, and fit within a circle
        # 640 pixels in diameter.
        # App icon without an icon background: This should be 1152×1152 pixels, and fit within a circle
        # 768 pixels in diameter.
        # image: assets/splash_screen.png

        color: "#3B0082"
        icon_background_color: "#3B0082"

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/mpg_icon.png"
